site_name: ShadowSim
site_description: Quantum simulation utilities (work in progress)
site_url: https://simsaidan.github.io/ShadowSim.py/
repo_url: https://github.com/simsaidan/ShadowSim.py
repo_name: simsaidan/ShadowSim.py
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow

markdown_extensions:
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
  - footnotes

nav:
  - Home: index.md
  # Replaced by the api-autonav plugin with one page per public module.
  - API Reference
  - References: references.md

plugins:
  - meta
  - search
  - markdown-exec
  - mkdocstrings:
      handlers:
        python:
          paths:
            - .
          options:
            show_root_heading: true
            show_root_full_path: false
            show_source: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            heading_level: 2
            signature_crossrefs: true
            separate_signature: true
            docstring_style: google
            docstring_section_style: list
            show_signature_annotations: true
            members_order: source
  - bibtex:
      bib_file: docs/refs.bib
      bib_by_default: false
      # The References page renders \full_bibliography itself. Leaving the
      # plugin command active emits footnote back-links to other pages.
      full_bib_command: \disable_full_bibliography
  - api-autonav:
      modules:
        - shadowsim
      nav_section_title: API Reference
      api_root_uri: reference
      exclude_private: true
      show_full_namespace: false

hooks:
  - docs/hooks/full_bibliography.py

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascript/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/simsaidan/ShadowSim.py
      name: ShadowSim on GitHub

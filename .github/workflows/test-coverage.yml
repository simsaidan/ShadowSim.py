name: Test and coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  code-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pin ruff to the version in pyproject so CI formatting matches local usage.
      - uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6 # v3.6.1
        with:
          version: "0.16.10"
      # Check only (no --fix / no in-place format): style and format violations must fail CI
      # rather than being silently auto-fixed in the runner and discarded.
      - run: ruff check
      - run: ruff format --check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - name: Install package, extras, and mypy
        run: uv sync --locked --all-extras --group types
      - name: Run mypy
        run: uv run --no-sync --group types mypy

  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHON: ${{ matrix.python-version }}
      # Headless backend so plot tests do not require a display (needed on Windows runners).
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Run tests
        if: matrix.python-version != '3.12' || matrix.os != 'ubuntu-latest'
        run: uv run --locked --all-extras pytest -v
      - name: Run tests with coverage
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: |
          uv run --locked --all-extras pytest -v --cov-config=.coveragerc --cov=shadowsim \
            --cov-report=xml --cov-report=term-missing:skip-covered
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          # Coverage upload is informational; a transient codecov CLI/CDN or
          # signature-verification failure should not red an otherwise-green build.
          fail_ci_if_error: false
          files: ./coverage.xml
          verbose: true

  core:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - name: Install core package and test tools
        run: uv sync --locked
      - name: Check core imports and missing extras
        run: uv run --no-sync python scripts/check_core_install.py
      - name: Run core tests
        run: >
          uv run --no-sync pytest -v
          -m "not qutip and not qiskit and not viz and not cross_extra"

  extras:
    strategy:
      fail-fast: false
      matrix:
        extra: [qutip, qiskit, viz]
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - name: Install package with ${{ matrix.extra }} extra
        run: uv sync --locked --extra ${{ matrix.extra }}
      - name: Run ${{ matrix.extra }} tests
        run: >
          uv run --no-sync pytest -v
          -m "${{ matrix.extra }} and not cross_extra"

  numpy-scipy-floor:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - name: Install locked extras
        run: uv sync --locked --all-extras
      - name: Downgrade to declared NumPy/SciPy floors
        # Exact floors from pyproject (numpy>=2.0, scipy>=1.14); lockfile stays unchanged.
        run: uv pip install "numpy==2.0.0" "scipy==1.14.0"
      - name: Run tests
        run: uv run --no-sync pytest -v

  numpy-scipy-latest:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - name: Install extras with newest NumPy/SciPy
        # May rewrite uv.lock in the runner workspace; that change is not committed.
        run: uv sync --all-extras --upgrade-package numpy --upgrade-package scipy
      - name: Run tests
        run: uv run --no-sync pytest -v

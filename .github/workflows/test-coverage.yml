name: Test and coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Qulacs vendors libgomp. Linux refuses that dlopen once NumPy, SciPy, and
# QuTiP have used the static TLS reserve. Reserve more before Python starts.
env:
  GLIBC_TUNABLES: glibc.rtld.optional_static_tls=1048576

jobs:
  code-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pin ruff to the version in pyproject so CI formatting matches local usage.
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.17.5"
      # Check only (no --fix / no in-place format): style and format violations must fail CI
      # rather than being silently auto-fixed in the runner and discarded.
      - run: ruff check
      - run: ruff format --check

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Install the core package
        run: uv sync --locked
      - name: Install Node packages
        run: npm ci
      - name: Lint the page scripts
        run: npm run lint
      - name: Test the page scripts
        run: npm test

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install package, extras, and mypy
        run: uv sync --locked --all-extras --group types
      - name: Run mypy
        run: uv run --no-sync --group types mypy

  test:
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHON: ${{ matrix.python-version }}
      # Headless backend so plot tests do not require a display (needed on Windows runners).
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Run tests
        if: matrix.python-version != '3.12' || matrix.os != 'ubuntu-latest'
        run: uv run --locked --all-extras pytest -v
      - name: Run tests with coverage
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: |
          uv run --locked --all-extras pytest -v --cov-config=.coveragerc --cov=shadowsim \
            --cov-report=xml --cov-report=term-missing:skip-covered
      - name: Upload coverage report
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  # Codecov matches the report to files in the git checkout. This job still
  # does not run the package tests. The OIDC token is only for the upload.
  coverage:
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download coverage report
        id: coverage
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-xml
      - name: Upload coverage to Codecov
        if: steps.coverage.outcome == 'success'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          # Coverage upload is informational; a transient codecov CLI/CDN or
          # signature-verification failure should not red an otherwise-green build.
          fail_ci_if_error: false
          files: coverage.xml
          verbose: true

  core:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install core package and test tools
        run: uv sync --locked
      - name: Check core imports and missing extras
        run: uv run --no-sync python scripts/check_core_install.py
      - name: Run core tests
        run: >
          uv run --no-sync pytest -v
          -m "not qutip and not qiskit and not viz and not qulacs and not cirq and not circuits and not cross_extra"

  extras:
    strategy:
      fail-fast: false
      matrix:
        extra: [qutip, qiskit, viz, circuits]
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install package with ${{ matrix.extra }} extra
        run: uv sync --locked --extra ${{ matrix.extra }}
      - name: Run ${{ matrix.extra }} tests
        run: >
          uv run --no-sync pytest -v
          -m "${{ matrix.extra }} and not cross_extra"

  circuits-isolation:
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: numpy
            install: --extra circuits
          - backend: qulacs
            install: --extra circuits --extra qulacs
          - backend: cirq
            install: --extra circuits --extra cirq
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install ${{ matrix.backend }} without Qiskit
        run: uv sync --locked --no-dev ${{ matrix.install }}
      - name: Run one closed Trotter step on ${{ matrix.backend }}
        run: uv run --no-sync python scripts/check_circuits_install.py ${{ matrix.backend }}

  numpy-scipy-floor:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install locked extras
        run: uv sync --locked --all-extras
      - name: Downgrade to declared NumPy/SciPy floors
        # Exact floors from pyproject (numpy>=2.0, scipy>=1.14); lockfile stays unchanged.
        run: uv pip install "numpy==2.0.0" "scipy==1.14.0"
      - name: Run tests
        run: uv run --no-sync pytest -v

  numpy-scipy-latest:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install extras with newest NumPy/SciPy
        # May rewrite uv.lock in the runner workspace; that change is not committed.
        run: uv sync --all-extras --upgrade-package numpy --upgrade-package scipy
      - name: Run tests
        run: uv run --no-sync pytest -v
